version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trading_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: trading_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d trading_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
