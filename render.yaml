databases:
  - name: trading-engine-db
    databaseName: trading_db
    user: trading_user
    plan: free

services:
  - type: web
    name: trading-engine-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trading-engine-db
          property: connectionString
      - key: INITIAL_CASH
        value: "100000.0"
      - key: POSITION_SIZE_CASH_PCT
        value: "0.10"
      - key: MAX_POSITION_EQUITY_PCT
        value: "0.25"
      - key: SLIPPAGE_PCT
        value: "0.0005"
      - key: COMMISSION_FLAT
        value: "1.00"
